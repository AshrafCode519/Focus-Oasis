name: Windows & Microsoft Store Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-packages:
    name: Build Windows (.msix & .zip)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code analysis
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test

      - name: Build Flutter Windows Desktop Release
        run: flutter build windows --release

      - name: Create MSIX Package for Sideloading
        run: dart run msix:create

      - name: Create MSIX Package for Microsoft Store
        run: dart run msix:create --store --output-name FocusOasis-Microsoft-Store

      - name: Compress Portable Windows Zip
        shell: pwsh
        run: |
          mkdir -p dist
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/FocusOasis-Windows-Portable-x64.zip

      - name: Upload Windows Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: focus-oasis-windows-binaries
          path: dist/*

      - name: Publish Windows Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.msix
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
