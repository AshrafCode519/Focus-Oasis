name: focus-oasis
version: '1.0.0'
summary: Smart Pomodoro timer with tree planting gamification
description: |
  Focus Oasis (واحة التركيز) is a productivity sanctuary combining the Pomodoro
  technique with gamified virtual tree cultivation, ambient zen sounds, and
  realtime cloud synchronization.
  Stay focused, overcome procrastination, and watch your mindful forest grow.

base: core22
confinement: strict
grade: stable
icon: snap/gui/focus-oasis.png

apps:
  focus-oasis:
    command: focus_oasis
    extensions: [gnome]
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - audio-playback
      - network
      - network-bind
      - home

parts:
  focus-oasis:
    plugin: flutter
    source: .
    flutter-target: lib/main.dart
    build-packages:
      - clang
      - cmake
      - ninja-build
      - pkg-config
      - libgtk-3-dev
      - liblzma-dev
      - libgstreamer1.0-dev
      - libgstreamer-plugins-base1.0-dev
    stage-packages:
      - libgstreamer1.0-0
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-pulseaudio
      - gstreamer1.0-alsa
